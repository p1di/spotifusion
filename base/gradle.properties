# Gradle: parallel, cached builds with a bounded daemon (fits a laptop and CI runners).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.vfs.watch=true
org.gradle.tooling.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# Android
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# Cronet ships cronet-api and cronet-shared under the same org.chromium.net namespace.
android.uniquePackageNames=false
